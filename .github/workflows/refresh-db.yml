name: Refresh quest database snapshot

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Build snapshot from the newest Questie release
        run: python tools/build_questdb.py --out data
      - name: Commit if the quest data changed
        run: |
          git config user.name "questie-compass-bot"
          git config user.email "questie-compass-bot@users.noreply.github.com"
          if git diff --quiet -- data/questdb-era.js; then
            echo "Quest data unchanged"; git checkout -- data; exit 0
          fi
          git add data/questdb-era.js data/questdb-era.meta.json
          git commit -m "data: refresh quest snapshot ($(python -c 'import json;print(json.load(open("data/questdb-era.meta.json"))["questieTag"])'))"
          git push
